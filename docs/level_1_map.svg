<text x="32" y="62" font-size="14" fill="#a9b9c9">Read each row left to right, then continue on the next row. Coordinates are world pixels.</text>
<text x="32" y="88" font-size="14">R = Raider    P = Peltast    H = Hoplite    + = Health flask</text>
