<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="1048" viewBox="0 0 1152 1048" role="img" aria-labelledby="title desc">
<title id="title">Level 1: The Temple Road route map</title>
<desc id="desc">Five consecutive 960-pixel areas showing all sixteen soldiers, fifteen stone terraces, five health flasks, and the temple exit.</desc>
<rect width="1152" height="1048" fill="#101827"/>
